nodeLinker: node-modules

# Keeps the package cache inside the project, in the gitignored `.yarn/cache`.
enableGlobalCache: false

# Exempt from the 24-hour npmMinimalAgeGate: sig-net publishes these and adopts releases the same day.
npmPreapprovedPackages:
  - '@sig-net/midnight'
  - '@sig-net/midnight-contract'
  - '@sig-net/midnight-serde'
  - '@sig-net/midnight-examples-erc20-vault-contract'
