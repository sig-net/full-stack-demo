# Publishes the production image (root Dockerfile) to Google Artifact Registry on release tags:
#   git tag v1.2.0-rc.1 && git push origin v1.2.0-rc.1
#   -> europe-west1-docker.pkg.dev/near-cs-dev/midnight/full-stack-demo-ui:v1.2.0-rc.1
# Stable tags (v1.2.0) must point at a commit on main; -rc tags may come from any branch.
#
# Each architecture builds on its native runner and pushes by digest; the merge job stitches the
# two digests into one multi-architecture manifest under the tag. Every job that touches the
# registry runs in the reviewer-gated `deploy` environment, which holds the service-account key
# and the deployment's public NEXT_PUBLIC_ variables (inlined into the browser bundle at build).
# Layers are not cached between runs: a publish job must not consume a poisonable cache.

name: docker-publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# One publish per tag at a time, never cancelled: a superseded run would leave a half-pushed tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE: europe-west1-docker.pkg.dev/near-cs-dev/midnight/full-stack-demo-ui

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse a ref that is not a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] ||
            ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::docker-publish runs on a vX.Y.Z or vX.Y.Z-rc.N tag only, got $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the stable-tag guard below asks whether the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Stable tags must point at a commit on main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::stable tag $GITHUB_REF_NAME is not on main; only -rc tags may come from other branches"
            exit 1
          }

  build:
    needs: verify-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the deployment's public configuration as build arguments
        id: public-config
        env:
          DEPLOY_VARIABLES: ${{ toJSON(vars) }}
        run: |
          {
            echo 'build-args<<END_OF_BUILD_ARGS'
            printf '%s' "$DEPLOY_VARIABLES" |
              jq -r 'to_entries[] | select(.key | startswith("NEXT_PUBLIC_")) | select(.value != "") | "\(.key)=\(.value)"'
            echo 'END_OF_BUILD_ARGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.public-config.outputs.build-args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: deploy
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Create and push the multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          set --
          for digest in *; do
            set -- "$@" "$IMAGE@sha256:$digest"
          done
          if [ "$#" -ne 2 ]; then
            echo "::error::expected one digest per architecture, found $#"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$@"
      - name: Inspect the published manifest
        run: docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
