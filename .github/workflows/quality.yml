name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify the pinned project Yarn launcher
        run: |
          mkdir -p .quality-tools
          curl --proto '=https' --tlsv1.2 -fsSL --retry 4 \
            https://repo.yarnpkg.com/4.18.0/packages/yarnpkg-cli/bin/yarn.js \
            -o .quality-tools/yarn.cjs
          echo 'fb8b1d20be72a0b544a35bcec4c7ed0ff55a9b173c01f191b02ba164b2051db5  .quality-tools/yarn.cjs' | sha256sum -c
      - name: Install the locked project dependencies
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"
          YARN_CACHE_FOLDER: .yarn/cache
          YARN_GLOBAL_FOLDER: .yarn/global
        run: node .quality-tools/yarn.cjs install --immutable
      - name: Run the complete quality gate
        run: node .quality-tools/yarn.cjs quality
