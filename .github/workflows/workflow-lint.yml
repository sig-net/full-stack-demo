name: workflow-lint

on:
  push:
    paths:
      - ".github/**"
      - "scripts/quality/zizmor-requirements.txt"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/quality/zizmor-requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned workflow validators
        run: |
          mkdir -p .quality-tools
          curl --proto '=https' --tlsv1.2 -fsSL --retry 4 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o .quality-tools/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  .quality-tools/actionlint.tar.gz' | sha256sum -c
          tar -xzf .quality-tools/actionlint.tar.gz -C .quality-tools actionlint
          python3 -m venv .quality-tools/python
          .quality-tools/python/bin/pip install --no-cache-dir --require-hashes -r scripts/quality/zizmor-requirements.txt
          command -v shellcheck
          echo "$PWD/.quality-tools" >> "$GITHUB_PATH"
          echo "$PWD/.quality-tools/python/bin" >> "$GITHUB_PATH"
      - name: Check workflow correctness
        run: actionlint
      - name: Check workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --cache-dir .quality-tools/zizmor-cache .github
